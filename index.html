<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>坦克大战 Tank Battle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior: none; }
  body {
    background: #1a1a2e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Courier New", monospace;
    color: #eee;
    flex-direction: column;
    gap: 8px;
    padding: 8px;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  h1 { font-size: 20px; color: #f5c518; letter-spacing: 4px; }
  #wrap { display: flex; gap: 12px; align-items: flex-start; }
  canvas {
    background: #000;
    border: 4px solid #444;
    border-radius: 4px;
    image-rendering: pixelated;
    touch-action: none;
  }
  #panel {
    width: 150px;
    background: #16213e;
    border: 2px solid #444;
    border-radius: 6px;
    padding: 12px;
    font-size: 14px;
    line-height: 1.9;
  }
  #panel .label { color: #8ab4f8; }
  #panel .value { color: #f5c518; font-weight: bold; }
  #help { margin-top: 10px; font-size: 12px; color: #999; line-height: 1.7; }
  #help kbd { background: #333; border-radius: 3px; padding: 1px 5px; color: #fff; }

  /* ============ 触屏控制区 ============ */
  #touch-controls {
    display: none;
    width: 100%;
    max-width: 480px;
    margin-top: 10px;
    justify-content: space-between;
    align-items: center;
    touch-action: none;
  }
  #dpad {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(3, 60px);
    gap: 4px;
  }
  .tbtn {
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 12px;
    color: #fff;
    font-size: 24px;
    display: flex;
    justify-content: center;
    align-items: center;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  .tbtn:active, .tbtn.pressed { background: rgba(245,197,24,0.45); border-color: #f5c518; }
  #btn-up    { grid-area: 1 / 2; }
  #btn-left  { grid-area: 2 / 1; }
  #btn-right { grid-area: 2 / 3; }
  #btn-down  { grid-area: 3 / 2; }
  #right-pad { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  #btn-fire {
    width: 92px; height: 92px;
    border-radius: 50%;
    background: rgba(244,67,54,0.3);
    border: 3px solid #f44336;
    color: #ffcdd2;
    font-size: 18px;
    font-weight: bold;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #btn-fire:active, #btn-fire.pressed { background: rgba(244,67,54,0.65); }
  #sys-btns { display: flex; gap: 8px; }
  .sbtn {
    background: #16213e;
    border: 1px solid #555;
    border-radius: 6px;
    color: #8ab4f8;
    font-size: 13px;
    padding: 6px 12px;
    font-family: inherit;
  }
  .sbtn:active { background: #2a3a5e; }

  /* 手机竖屏布局 */
  @media (max-width: 820px), (pointer: coarse) {
    h1 { font-size: 16px; margin-top: 4px; }
    #wrap { flex-direction: column; align-items: center; gap: 8px; }
    canvas {
      width: min(96vw, calc(100vh - 300px));
      width: min(96vw, calc(100dvh - 300px));
      height: auto;
      min-width: 260px;
    }
    #panel {
      width: min(96vw, 480px);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
      padding: 8px 12px;
      font-size: 13px;
      line-height: 1.5;
    }
    #help { display: none; }
    #touch-controls { display: flex; }
  }
</style>
</head>
<body>
  <h1>★ 坦克大战 ★</h1>
  <div id="wrap">
    <canvas id="game" width="600" height="600"></canvas>
    <div id="panel">
      <div><span class="label">关卡:</span> <span class="value" id="ui-level">1</span></div>
      <div><span class="label">得分:</span> <span class="value" id="ui-score">0</span></div>
      <div><span class="label">生命:</span> <span class="value" id="ui-lives">3</span></div>
      <div><span class="label">剩余敌人:</span> <span class="value" id="ui-enemies">12</span></div>
      <div id="help">
        <b style="color:#f5c518">操作说明</b><br>
        <kbd>W A S D</kbd> / 方向键: 移动<br>
        <kbd>空格</kbd>: 射击<br>
        <kbd>P</kbd>: 暂停<br>
        <kbd>R</kbd>: 重新开始<br>
        <br>
        消灭所有敌人过关。<br>
        基地被毁或生命耗尽则失败！
      </div>
    </div>
  </div>

  <!-- 触屏虚拟按键 -->
  <div id="touch-controls">
    <div id="dpad">
      <div class="tbtn" id="btn-up"    data-key="w">▲</div>
      <div class="tbtn" id="btn-left"  data-key="a">◀</div>
      <div class="tbtn" id="btn-right" data-key="d">▶</div>
      <div class="tbtn" id="btn-down"  data-key="s">▼</div>
    </div>
    <div id="right-pad">
      <button id="btn-fire">开火</button>
      <div id="sys-btns">
        <button class="sbtn" id="btn-pause">暂停</button>
        <button class="sbtn" id="btn-restart">重开</button>
      </div>
    </div>
  </div>

<script>
(function () {
  "use strict";

  // ===================== 常量 =====================
  const CELL = 40;            // 格子大小
  const COLS = 15, ROWS = 15; // 地图尺寸
  const W = COLS * CELL, H = ROWS * CELL;
  const TANK_SIZE = 34;

  const T = { EMPTY: 0, BRICK: 1, STEEL: 2, WATER: 3, BUSH: 4, BASE: 9 };
  const DIR = { UP: 0, RIGHT: 1, DOWN: 2, LEFT: 3 };
  const DV = [[0, -1], [1, 0], [0, 1], [-1, 0]];

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  // ===================== 关卡地图 =====================
  // 0空地 1砖墙 2钢墙 3水 4草丛 9基地
  const LEVELS = [
    [
      "000000000000000",
      "001100111001100",
      "001100111001100",
      "001100000001100",
      "000002222220000",
      "011000000000110",
      "011004444400110",
      "000004444400000",
      "011000000000110",
      "011001111100110",
      "000001000100000",
      "001101000101100",
      "001100111001100",
      "000000111000000",
      "000000191000000"
    ],
    [
      "000000222000000",
      "011100000001110",
      "011100111001110",
      "000100000001000",
      "222000111000222",
      "000000000000000",
      "001104444401100",
      "001104444401100",
      "000000000000000",
      "222001111100222",
      "000100000001000",
      "011100111001110",
      "011100000001110",
      "000000111000000",
      "000000191000000"
    ],
    [
      "000011111110000",
      "002010000010200",
      "000010111010000",
      "011010000010110",
      "010000222000010",
      "010440000044010",
      "010440333044010",
      "010000333000010",
      "011000000000110",
      "000110111011000",
      "002010000010200",
      "000010111010000",
      "011100000001110",
      "000000111000000",
      "000000191000000"
    ]
  ];

  // ===================== 游戏状态 =====================
  let map = [];            // 当前地图
  let player = null;
  let enemies = [];
  let bullets = [];
  let explosions = [];
  let score = 0;
  let lives = 3;
  let level = 0;
  let enemiesLeft = 0;     // 本关剩余（含未出场）
  let spawnTimer = 0;
  let gameState = "playing"; // playing | paused | over | win
  let message = "";
  let shieldTime = 0;      // 出生无敌时间

  const keys = {};

  // ===================== 地图工具 =====================
  function loadLevel(idx) {
    map = LEVELS[idx % LEVELS.length].map(row => row.split("").map(Number));
    enemies = [];
    bullets = [];
    explosions = [];
    enemiesLeft = 12;
    spawnTimer = 0;
    player = makeTank(4 * CELL + 3, 14 * CELL + 3, DIR.UP, true);
    shieldTime = 120;
    gameState = "playing";
    message = "";
  }

  function tileAt(c, r) {
    if (c < 0 || c >= COLS || r < 0 || r >= ROWS) return T.STEEL;
    return map[r][c];
  }

  function isSolidForTank(t) {
    return t === T.BRICK || t === T.STEEL || t === T.WATER || t === T.BASE;
  }

  function rectHitsSolid(x, y, size) {
    const c1 = Math.floor(x / CELL), c2 = Math.floor((x + size - 1) / CELL);
    const r1 = Math.floor(y / CELL), r2 = Math.floor((y + size - 1) / CELL);
    for (let r = r1; r <= r2; r++)
      for (let c = c1; c <= c2; c++)
        if (isSolidForTank(tileAt(c, r))) return true;
    return false;
  }

  function aabb(a, b) {
    return a.x < b.x + b.size && a.x + a.size > b.x &&
           a.y < b.y + b.size && a.y + a.size > b.y;
  }

  // ===================== 坦克 =====================
  function makeTank(x, y, dir, isPlayer) {
    return {
      x, y, dir, size: TANK_SIZE,
      speed: isPlayer ? 2.2 : 1.3,
      isPlayer,
      cooldown: 0,
      aiTimer: 0,
      dead: false
    };
  }

  function tryMove(t, dir) {
    t.dir = dir;
    const [dx, dy] = DV[dir];
    // 转向时向格子对齐，方便穿过单格通道
    if (dx === 0) {
      const snapped = Math.round(t.x / 4) * 4;
      if (Math.abs(snapped - t.x) <= t.speed) t.x = snapped;
    } else {
      const snapped = Math.round(t.y / 4) * 4;
      if (Math.abs(snapped - t.y) <= t.speed) t.y = snapped;
    }
    const nx = t.x + dx * t.speed;
    const ny = t.y + dy * t.speed;
    if (nx < 0 || ny < 0 || nx + t.size > W || ny + t.size > H) return;
    if (rectHitsSolid(nx, ny, t.size)) return;
    // 坦克之间不能重叠
    const test = { x: nx, y: ny, size: t.size };
    if (player && t !== player && !player.dead && aabb(test, player)) return;
    for (const e of enemies) {
      if (e !== t && !e.dead && aabb(test, e)) return;
    }
    t.x = nx; t.y = ny;
  }

  function shoot(t) {
    if (t.cooldown > 0) return;
    t.cooldown = t.isPlayer ? 18 : 45;
    const [dx, dy] = DV[t.dir];
    const cx = t.x + t.size / 2, cy = t.y + t.size / 2;
    bullets.push({
      x: cx + dx * (t.size / 2) - 3,
      y: cy + dy * (t.size / 2) - 3,
      size: 6, dir: t.dir, speed: 5,
      fromPlayer: t.isPlayer
    });
  }

  // ===================== 敌人 AI =====================
  function updateEnemy(e) {
    e.aiTimer--;
    if (e.aiTimer <= 0 || Math.random() < 0.008) {
      e.aiTimer = 40 + Math.random() * 80;
      // 70% 概率朝基地/下方大方向，30% 随机
      e.dir = Math.random() < 0.7
        ? [DIR.DOWN, DIR.LEFT, DIR.RIGHT][Math.floor(Math.random() * 3)]
        : Math.floor(Math.random() * 4);
    }
    const before = { x: e.x, y: e.y };
    tryMove(e, e.dir);
    if (before.x === e.x && before.y === e.y) e.aiTimer = 0; // 撞墙换向
    if (Math.random() < 0.02) shoot(e);
    e.cooldown = Math.max(0, e.cooldown - 1);
  }

  function spawnEnemy() {
    if (enemiesLeft <= 0 || enemies.filter(e => !e.dead).length >= 4) return;
    const spots = [[0, 0], [7, 0], [14, 0]];
    const [c] = [spots[Math.floor(Math.random() * spots.length)]];
    const x = c[0] * CELL + 3, y = c[1] * CELL + 3;
    const box = { x, y, size: TANK_SIZE };
    if ((player && !player.dead && aabb(box, player)) ||
        enemies.some(e => !e.dead && aabb(box, e))) return;
    enemies.push(makeTank(x, y, DIR.DOWN, false));
    enemiesLeft--;
  }

  // ===================== 子弹 =====================
  function updateBullets() {
    for (const b of bullets) {
      const [dx, dy] = DV[b.dir];
      b.x += dx * b.speed;
      b.y += dy * b.speed;

      // 出界
      if (b.x < 0 || b.y < 0 || b.x > W || b.y > H) { b.dead = true; continue; }

      // 打中地形
      const c1 = Math.floor(b.x / CELL), c2 = Math.floor((b.x + b.size - 1) / CELL);
      const r1 = Math.floor(b.y / CELL), r2 = Math.floor((b.y + b.size - 1) / CELL);
      let hitTile = false;
      for (let r = r1; r <= r2 && !hitTile; r++) {
        for (let c = c1; c <= c2 && !hitTile; c++) {
          const t = tileAt(c, r);
          if (t === T.BRICK) {
            map[r][c] = T.EMPTY;
            b.dead = true; hitTile = true;
          } else if (t === T.STEEL) {
            b.dead = true; hitTile = true;
          } else if (t === T.BASE) {
            map[r][c] = T.EMPTY;
            b.dead = true; hitTile = true;
            gameOver("基地被摧毁！");
          }
        }
      }
      if (b.dead) { explode(b.x, b.y, 10); continue; }

      // 子弹对撞
      for (const o of bullets) {
        if (o !== b && !o.dead && o.fromPlayer !== b.fromPlayer && aabb(b, o)) {
          b.dead = o.dead = true;
        }
      }
      if (b.dead) continue;

      // 打中坦克
      if (b.fromPlayer) {
        for (const e of enemies) {
          if (!e.dead && aabb(b, e)) {
            e.dead = b.dead = true;
            score += 100;
            explode(e.x + e.size / 2, e.y + e.size / 2, 22);
            break;
          }
        }
      } else if (player && !player.dead && shieldTime <= 0 && aabb(b, player)) {
        b.dead = true;
        playerHit();
      }
    }
    bullets = bullets.filter(b => !b.dead);
    enemies = enemies.filter(e => !e.dead);
  }

  function playerHit() {
    explode(player.x + player.size / 2, player.y + player.size / 2, 26);
    lives--;
    if (lives <= 0) {
      player.dead = true;
      gameOver("坦克全部损毁！");
    } else {
      player = makeTank(4 * CELL + 3, 14 * CELL + 3, DIR.UP, true);
      shieldTime = 120;
    }
  }

  function explode(x, y, size) {
    explosions.push({ x, y, size, life: 16 });
  }

  function gameOver(msg) {
    gameState = "over";
    message = msg;
  }

  function levelClear() {
    level++;
    if (level >= LEVELS.length) {
      gameState = "win";
      message = "通关成功！你是真正的王牌坦克手！";
    } else {
      loadLevel(level);
    }
  }

  // ===================== 玩家输入 =====================
  function updatePlayer() {
    if (!player || player.dead) return;
    let dir = -1;
    if (keys["arrowup"] || keys["w"]) dir = DIR.UP;
    else if (keys["arrowright"] || keys["d"]) dir = DIR.RIGHT;
    else if (keys["arrowdown"] || keys["s"]) dir = DIR.DOWN;
    else if (keys["arrowleft"] || keys["a"]) dir = DIR.LEFT;
    if (dir >= 0) tryMove(player, dir);
    if (keys[" "]) shoot(player);
    player.cooldown = Math.max(0, player.cooldown - 1);
    if (shieldTime > 0) shieldTime--;
  }

  // ===================== 主循环 =====================
  function update() {
    if (gameState !== "playing") return;
    updatePlayer();
    spawnTimer--;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = 150;
    }
    for (const e of enemies) updateEnemy(e);
    updateBullets();
    for (const ex of explosions) ex.life--;
    explosions = explosions.filter(ex => ex.life > 0);

    if (enemiesLeft === 0 && enemies.length === 0) levelClear();
    updateUI();
  }

  // ===================== 绘制 =====================
  function drawTile(c, r, t) {
    const x = c * CELL, y = r * CELL;
    if (t === T.BRICK) {
      ctx.fillStyle = "#b5533c";
      ctx.fillRect(x, y, CELL, CELL);
      ctx.fillStyle = "#8a3b28";
      for (let i = 0; i < 2; i++)
        for (let j = 0; j < 2; j++)
          ctx.fillRect(x + i * 20 + 2, y + j * 20 + 2, 16, 7);
      ctx.fillRect(x + 2, y + 22, 16, 7);
      ctx.fillRect(x + 22, y + 22, 16, 7);
    } else if (t === T.STEEL) {
      ctx.fillStyle = "#9aa5b1";
      ctx.fillRect(x + 2, y + 2, CELL - 4, CELL - 4);
      ctx.fillStyle = "#e4e9ee";
      ctx.fillRect(x + 6, y + 6, 12, 12);
      ctx.fillRect(x + 22, y + 22, 12, 12);
    } else if (t === T.WATER) {
      ctx.fillStyle = "#1565c0";
      ctx.fillRect(x, y, CELL, CELL);
      ctx.fillStyle = "#42a5f5";
      const off = (Date.now() / 300 + c + r) % 2 < 1 ? 0 : 6;
      ctx.fillRect(x + 6 + off, y + 10, 14, 3);
      ctx.fillRect(x + 14 - off, y + 26, 14, 3);
    } else if (t === T.BASE) {
      ctx.fillStyle = "#f5c518";
      ctx.beginPath();
      ctx.moveTo(x + 20, y + 4);
      ctx.lineTo(x + 36, y + 20);
      ctx.lineTo(x + 28, y + 20);
      ctx.lineTo(x + 28, y + 34);
      ctx.lineTo(x + 12, y + 34);
      ctx.lineTo(x + 12, y + 20);
      ctx.lineTo(x + 4, y + 20);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawBush(c, r) {
    const x = c * CELL, y = r * CELL;
    ctx.fillStyle = "rgba(46,125,50,0.85)";
    ctx.fillRect(x, y, CELL, CELL);
    ctx.fillStyle = "rgba(102,187,106,0.9)";
    ctx.beginPath();
    ctx.arc(x + 10, y + 12, 7, 0, 7);
    ctx.arc(x + 26, y + 10, 8, 0, 7);
    ctx.arc(x + 18, y + 26, 9, 0, 7);
    ctx.fill();
  }

  function drawTank(t) {
    const cx = t.x + t.size / 2, cy = t.y + t.size / 2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(t.dir * Math.PI / 2);
    const body = t.isPlayer ? "#4caf50" : "#b0b0b0";
    const dark = t.isPlayer ? "#2e7d32" : "#6e6e6e";
    // 履带
    ctx.fillStyle = dark;
    ctx.fillRect(-t.size / 2, -t.size / 2, 9, t.size);
    ctx.fillRect(t.size / 2 - 9, -t.size / 2, 9, t.size);
    // 履带纹理
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    for (let i = -t.size / 2 + 3; i < t.size / 2 - 2; i += 7) {
      ctx.fillRect(-t.size / 2, i, 9, 2);
      ctx.fillRect(t.size / 2 - 9, i, 9, 2);
    }
    // 车身
    ctx.fillStyle = body;
    ctx.fillRect(-t.size / 2 + 7, -t.size / 2 + 3, t.size - 14, t.size - 6);
    // 炮塔
    ctx.fillStyle = dark;
    ctx.beginPath();
    ctx.arc(0, 0, 8, 0, 7);
    ctx.fill();
    // 炮管（朝上，靠旋转实现方向）
    ctx.fillRect(-2.5, -t.size / 2 - 4, 5, t.size / 2 + 6);
    ctx.restore();

    // 无敌护盾
    if (t.isPlayer && shieldTime > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
      ctx.strokeStyle = "#4fc3f7";
      ctx.lineWidth = 2;
      ctx.strokeRect(t.x - 2, t.y - 2, t.size + 4, t.size + 4);
    }
  }

  function draw() {
    ctx.fillStyle = "#0d0d0d";
    ctx.fillRect(0, 0, W, H);

    // 底层地形（草丛最后画，盖住坦克）
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++) {
        const t = map[r][c];
        if (t !== T.BUSH && t !== T.EMPTY) drawTile(c, r, t);
      }

    for (const e of enemies) if (!e.dead) drawTank(e);
    if (player && !player.dead) drawTank(player);

    // 子弹
    ctx.fillStyle = "#fff59d";
    for (const b of bullets) ctx.fillRect(b.x, b.y, b.size, b.size);

    // 草丛覆盖层
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < COLS; c++)
        if (map[r][c] === T.BUSH) drawBush(c, r);

    // 爆炸
    for (const ex of explosions) {
      const p = ex.life / 16;
      ctx.fillStyle = `rgba(255,${Math.floor(160 * p)},40,${p})`;
      ctx.beginPath();
      ctx.arc(ex.x, ex.y, ex.size * (1.2 - p * 0.5), 0, 7);
      ctx.fill();
    }

    // 状态提示
    if (gameState !== "playing") {
      ctx.fillStyle = "rgba(0,0,0,0.65)";
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = gameState === "win" ? "#76ff03" : gameState === "over" ? "#ff5252" : "#f5c518";
      ctx.font = "bold 30px 'Courier New'";
      ctx.textAlign = "center";
      const title = gameState === "win" ? "★ 胜利 ★"
                  : gameState === "over" ? "游戏结束" : "已暂停";
      ctx.fillText(title, W / 2, H / 2 - 30);
      ctx.font = "18px 'Courier New'";
      ctx.fillStyle = "#eee";
      ctx.fillText(message, W / 2, H / 2 + 6);
      ctx.fillText("按 R / 点击重开 重新开始", W / 2, H / 2 + 40);
    }
  }

  function updateUI() {
    document.getElementById("ui-level").textContent = level + 1;
    document.getElementById("ui-score").textContent = score;
    document.getElementById("ui-lives").textContent = lives;
    document.getElementById("ui-enemies").textContent =
      enemiesLeft + enemies.filter(e => !e.dead).length;
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ===================== 键盘事件 =====================
  function togglePause() {
    if (gameState === "playing" || gameState === "paused")
      gameState = gameState === "playing" ? "paused" : "playing";
  }
  function restart() {
    score = 0; lives = 3; level = 0;
    loadLevel(0);
    updateUI();
  }

  window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if ([" ", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k))
      e.preventDefault();
    if (k === "p") togglePause();
    if (k === "r") restart();
  });
  window.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  // ===================== 触屏事件 =====================
  // 方向键：pointer 事件，支持多点触控（可边移动边开火）
  document.querySelectorAll(".tbtn").forEach(btn => {
    const key = btn.dataset.key;
    const press = e => {
      e.preventDefault();
      keys[key] = true;
      btn.classList.add("pressed");
      if (btn.setPointerCapture && e.pointerId !== undefined) {
        try { btn.setPointerCapture(e.pointerId); } catch (_) {}
      }
    };
    const release = e => {
      keys[key] = false;
      btn.classList.remove("pressed");
    };
    btn.addEventListener("pointerdown", press);
    btn.addEventListener("pointerup", release);
    btn.addEventListener("pointercancel", release);
    btn.addEventListener("lostpointercapture", release);
    btn.addEventListener("contextmenu", e => e.preventDefault());
  });

  // 开火键：按住连发
  const fireBtn = document.getElementById("btn-fire");
  fireBtn.addEventListener("pointerdown", e => {
    e.preventDefault();
    keys[" "] = true;
    fireBtn.classList.add("pressed");
    try { fireBtn.setPointerCapture(e.pointerId); } catch (_) {}
  });
  const fireRelease = () => {
    keys[" "] = false;
    fireBtn.classList.remove("pressed");
  };
  fireBtn.addEventListener("pointerup", fireRelease);
  fireBtn.addEventListener("pointercancel", fireRelease);
  fireBtn.addEventListener("lostpointercapture", fireRelease);
  fireBtn.addEventListener("contextmenu", e => e.preventDefault());

  document.getElementById("btn-pause").addEventListener("click", togglePause);
  document.getElementById("btn-restart").addEventListener("click", restart);

  // 阻止触屏滚动画布区域、双击缩放
  canvas.addEventListener("touchstart", e => e.preventDefault(), { passive: false });
  document.getElementById("touch-controls")
    .addEventListener("touchmove", e => e.preventDefault(), { passive: false });
  document.addEventListener("dblclick", e => e.preventDefault());

  // ===================== 启动 =====================
  loadLevel(0);
  updateUI();
  loop();
})();
</script>
</body>
</html>
